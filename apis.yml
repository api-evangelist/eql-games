name: EQL Games
description: >-
  EQL Games is a Louisville, Kentucky based lottery-industry technology company
  that operates as an original game studio, third-party content aggregator, and
  boutique licensor for the global iLottery market. Its iLottery Marketplace
  aggregates a catalog of 300+ games from 24 partner studios behind a single
  integration point for lottery operators, while its EQL Labs innovation
  division builds original instant-win and eInstant titles that fold in licensed
  intellectual property and live sports. The company also represents brands
  across lottery verticals (instant scratch and eInstant) and reports serving 8
  lottery clients. EQL Games was surfaced through Bullpen Capital's portfolio and
  added to the API Evangelist network; it publishes a marketing and corporate web
  presence but no public developer portal, API documentation, or machine-readable
  API specification at this time.
